<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 20 440 240" width="100%" height="100%">
  <defs>
    <!-- Ribbon 1 Gradient: Top-Left to Bottom-Right -->
    <linearGradient id="ribbon1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A3E0" />
      <stop offset="30%" stop-color="#0055A5" />
      <stop offset="65%" stop-color="#D91E48" />
      <stop offset="100%" stop-color="#F36F21" />
    </linearGradient>

    <!-- Ribbon 2 Gradient: Top-Right to Bottom-Left -->
    <linearGradient id="ribbon2Grad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFC20E" />
      <stop offset="35%" stop-color="#E84A1A" />
      <stop offset="75%" stop-color="#112A54" />
      <stop offset="100%" stop-color="#0072CE" />
    </linearGradient>
  </defs>

  <!-- GRAPHIC SYMBOL (X RIBBONS) -->
  <g>
    <!-- Ribbon 1 (Cyan-Blue-Magenta-Orange) -->
    <path d="M 85 40 C 185 0, 345 90, 425 240 C 355 255, 215 155, 115 240 C 175 185, 305 140, 365 90 C 275 50, 155 45, 85 40 Z" fill="url(#ribbon1Grad)" />
    <path d="M 65 35 C 195 -15, 355 80, 435 245 C 345 265, 205 150, 105 245 C 155 200, 285 140, 355 85 C 255 35, 145 30, 65 35 Z" fill="url(#ribbon1Grad)" opacity="0.95" />

    <!-- Ribbon 2 (Yellow-Red-Navy-Blue) -->
    <path d="M 415 35 C 285 -15, 125 80, 45 245 C 135 265, 275 150, 375 245 C 325 200, 195 140, 125 85 C 225 35, 335 30, 415 35 Z" fill="url(#ribbon2Grad)" />
    <path d="M 395 40 C 295 0, 135 90, 55 240 C 125 255, 265 155, 365 240 C 305 185, 175 140, 115 90 C 205 50, 325 45, 395 40 Z" fill="url(#ribbon2Grad)" opacity="0.9" />
  </g>

  <!-- LOGO TEXT: ADIX MEDIA -->
  <g transform="translate(240, 245)" text-anchor="middle">
    <!-- ADIX -->
    <text x="-85" y="0" font-family="'Montserrat', 'Segoe UI', 'Arial Black', sans-serif" font-weight="900" font-size="42" fill="#9B2335" letter-spacing="4">ADIX</text>
    <!-- MEDIA -->
    <text x="75" y="0" font-family="'Montserrat', 'Segoe UI', 'Arial Black', sans-serif" font-weight="900" font-size="42" fill="#1B365D" letter-spacing="4">MEDIA</text>
  </g>
</svg>